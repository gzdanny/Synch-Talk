<!DOCTYPE html>
<html>

<head>
  <title>Synch-Talk</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="language-select" id="target-language-select-container">
        <label>Select Languages:</label>
        <div class="custom-select-trigger" id="target-languages-display">
          Please select
        </div>
        <div class="custom-select-options" id="target-languages-options">
        </div>
      </div>
    </div>

    <div class="chat-area" id="chat-area">
    </div>

    <div class="input-area">
      <textarea id="user-input" placeholder="Message Synch-Talk..."></textarea>
      <div class="controls">
        <button id="tutor-mode-toggle" title="AI Tutor"></button>
        <button id="send-btn" title="Send"></button>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>

</html>
